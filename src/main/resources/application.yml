server:
  port: 8080

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/simple_exchange?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: root

  data:
    mongodb:
      uri: mongodb://localhost:27017/simple_exchange

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: exchange-group
      auto-offset-reset: latest

  redis:
    host: localhost
    port: 6379

  # MyBatis Plus
  mybatis-plus:
    configuration:
      log-impl: org.apache.ibatis.logging.stdout.StdOutImpl